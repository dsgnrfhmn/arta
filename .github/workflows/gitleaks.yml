# Second line behind the local pre-commit hook: scan every push and pull request
# for secrets. The private denylist is not available here by design; this checks
# only gitleaks' own rules. Push protection is switched on in the repository's
# GitHub settings (Code security), not in this file.
name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
